<style>
:root{
  --bg:#0d0d10; --surface:#16161b; --surface-2:#1e1e25; --line:#2b2b34;
  --gold:#d6b26a; --gold-deep:#a98a4b; --steel:#8e939d;
  --text:#ece6d8; --muted:#9b978c;
  --danger:#e5645a; --ok:#6fcf9b; --blue:#8fb4d9;
  --r:14px; --top:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.65;min-height:100dvh;overflow-x:hidden}
img{max-width:100%}
a{color:var(--gold)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.muted{color:var(--muted)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;background:rgba(13,13,16,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--gold);font-weight:800;font-size:1.2rem;margin-inline-end:auto}
.brand img{width:36px;height:36px;border-radius:9px;object-fit:cover}
.avatar-btn{display:block;border-radius:50%}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:inline-grid;place-items:center;font-weight:700;color:var(--gold);flex:none}
.av-sm{width:26px;height:26px;font-size:.8rem}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:50;width:min(84vw,320px);background:var(--surface);border-inline-start:1px solid var(--line);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.drawer-head img.logo{width:64px;height:64px;border-radius:14px;object-fit:cover}
.drawer-head .who{min-width:0}
.drawer-head .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer nav{flex:1;overflow:auto;padding:10px}
.drawer nav a,.drawer nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border-radius:12px;border:0;background:none;color:var(--text);text-decoration:none;cursor:pointer;text-align:start}
.drawer nav a[aria-current=page]{background:var(--surface-2);color:var(--gold);font-weight:700}
.drawer nav .sep{height:1px;background:var(--line);margin:8px 6px}
.drawer nav .out{color:var(--danger)}
.drawer-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:.85rem}

/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 90px}
.page-title{font-size:1.35rem;font-weight:800;margin:6px 0 4px}
.page-sub{color:var(--muted);margin-bottom:16px;max-width:60ch}

/* ---------- Hero ---------- */
.hero-banner{margin:-16px -14px 0}
.hero-banner img{display:block;width:100%;min-height:92px;object-fit:cover}
.hero-copy{padding:18px 0 4px}
.hero-copy h1{font-size:1.5rem;font-weight:800;line-height:1.4}
.hero-copy p{color:var(--muted);margin-top:6px;max-width:56ch}
.cta-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
@media(min-width:760px){
  .hero-banner{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .hero-copy h1{font-size:1.9rem}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-gold{background:var(--gold);color:#1b1408}
.btn-line{border-color:var(--gold-deep);color:var(--gold);background:transparent}
.btn-ghost{background:var(--surface-2);border-color:var(--line);color:var(--text)}
.btn-danger{background:transparent;border-color:#5a2f2c;color:var(--danger)}
.btn-sm{min-height:38px;padding:0 14px;font-size:.9rem;border-radius:10px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* ---------- Filters ---------- */
.filters{margin:18px 0 12px;display:grid;gap:10px}
.search{position:relative}
.search input{padding-inline-start:44px}
.search .ic{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1b1408;font-weight:700}
.result-count{color:var(--muted);font-size:.88rem;margin:4px 2px 10px}

/* ---------- Feed / cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--gold-deep)}
.card-media{position:relative;aspect-ratio:4/3;background:var(--surface-2)}
.card-media img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{height:100%;display:grid;place-items:center;color:var(--steel)}
.noimg .ic{width:38px;height:38px}
.tag{position:absolute;top:10px;inset-inline-start:10px;padding:2px 12px;border-radius:999px;font-size:.82rem;font-weight:800;background:rgba(13,13,16,.88);border:1px solid currentColor}
.tag-sell{color:var(--gold)} .tag-trade{color:var(--blue)} .tag-buy{color:var(--ok)}
.count{position:absolute;bottom:10px;inset-inline-end:10px;padding:1px 10px;border-radius:999px;font-size:.78rem;background:rgba(13,13,16,.85)}
.card-body{padding:12px 14px 14px;display:grid;gap:6px;flex:1}
.card-meta{display:flex;gap:8px;font-size:.82rem;color:var(--steel)}
.card-meta span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--steel);margin-inline-end:8px;vertical-align:middle}
.card h3{font-size:1.05rem;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.deal{color:var(--gold);font-weight:800}
.poster{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:.88rem}
.poster .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster time{margin-inline-start:auto;color:var(--muted);font-size:.8rem;flex:none}
.mm-name{font-weight:800}
.vbadge{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-inline-start:4px;color:var(--c,var(--gold))}
.vbadge .ic{width:17px;height:17px;stroke-width:2}
.vbadge b{font-size:.74rem;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:0 8px}

.empty{grid-column:1/-1;text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:14px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);margin:0 auto 12px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Forms ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:.92rem}
.field small{color:var(--muted)}
.row2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:460px){.row2{grid-template-columns:1fr}}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit;font-size:16px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,178,106,.22)}
input[type=color]{padding:3px;min-height:40px;width:52px;cursor:pointer}
input[type=file]{display:none}
.drop{display:grid;place-items:center;gap:4px;padding:20px;border:1.5px dashed var(--gold-deep);border-radius:12px;background:var(--surface-2);color:var(--gold);cursor:pointer;text-align:center}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.75);display:grid;place-items:center;cursor:pointer}
.thumb .ic{width:16px;height:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:grid;place-items:center;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;color:var(--muted)}
.seg input:checked+span{border-color:var(--gold);color:var(--gold);background:rgba(214,178,106,.1)}
.seg input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72)}
.modal.open{display:flex}
.sheet{position:relative;width:100%;max-width:640px;max-height:93dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet-close{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(13,13,16,.85);display:grid;place-items:center;cursor:pointer}
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#000}
.gallery img{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:contain}
.sheet-body{padding:16px;display:grid;gap:12px}
.sheet-body h2{font-size:1.25rem;line-height:1.45}
.sheet-body .desc{white-space:pre-wrap;word-break:break-word}
.kv{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2)}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv span:first-child{color:var(--muted)}
.contact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.contact code{flex:1;min-width:0;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis}
.notice{padding:12px 14px;border-radius:12px;border:1px solid #5a4a2a;background:rgba(214,178,106,.08);font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Profile / requests / admin ---------- */
.me{display:flex;align-items:center;gap:14px}
.me .av{width:64px;height:64px;font-size:1.5rem}
.me h2{font-size:1.2rem}
.list{display:grid;gap:10px}
.mine{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.mine img,.mine .noimg{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2)}
.mine .info{flex:1;min-width:0}
.mine .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine.sold{opacity:.65}
.steps{display:grid;gap:10px;counter-reset:s;list-style:none}
.steps li{position:relative;padding-inline-start:44px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold-deep);color:var(--gold);font-weight:800}
.req{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:6px}
.req-h{display:flex;justify-content:space-between;align-items:center}
.st{padding:0 12px;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid currentColor}
.st-pending{color:var(--gold)} .st-claimed{color:var(--blue)} .st-done{color:var(--ok)}
.req dl{display:grid;gap:2px;font-size:.9rem}
.req dt{color:var(--muted);display:inline}
.req dd{display:inline;margin:0}
.user-row{display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.user-row .top{display:flex;align-items:center;gap:10px}
.user-row .top div{min-width:0}
.user-row .top small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.user-row .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rules{display:grid;gap:12px;list-style:none;counter-reset:r}
.rules li{padding:14px 14px 14px 14px;padding-inline-start:52px;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;counter-increment:r}
.rules li::before{content:counter(r);position:absolute;inset-inline-start:14px;top:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--gold);font-weight:800;font-size:.9rem}
.rules b{display:block;margin-bottom:2px}
.section-h{font-size:1.1rem;font-weight:800;margin:22px 0 10px}

/* ---------- Ratings ---------- */
.stars{position:relative;display:inline-block;line-height:0;vertical-align:middle;--s:16px}
.stars .row{display:flex;width:max-content}
.stars svg{width:var(--s);height:var(--s);flex:none;display:block;fill:currentColor}
.stars .base{color:#3a3a44}
.stars .fill{position:absolute;top:0;inset-inline-start:0;overflow:hidden;color:var(--gold)}
.rate-chip{display:inline-flex;align-items:center;gap:4px;flex:none;min-height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:.8rem;font-weight:700;cursor:pointer}
.rate-chip svg{width:14px;height:14px;fill:var(--gold)}
.rate-chip small{color:var(--muted);font-weight:400;font-size:.78rem}
.rate-chip.none{color:var(--muted);font-weight:400}
.rmodal{z-index:80}
.starpick{display:flex;justify-content:center;gap:6px;margin:4px 0 0}
.starpick button{width:54px;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:#4a4a55;transition:color .12s,border-color .12s}
.starpick button svg{width:32px;height:32px;fill:currentColor}
.starpick button.on{color:var(--gold);border-color:var(--gold-deep)}
.rate-word{text-align:center;min-height:1.7em;font-weight:800;color:var(--gold)}
.counter{text-align:end;color:var(--muted);font-size:.8rem}
.summary{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.big-avg{text-align:center}
.big-avg b{display:block;font-size:2.7rem;line-height:1.1;color:var(--gold);font-weight:800}
.dist{display:grid;gap:5px;margin-bottom:6px}
.dist>div{display:grid;grid-template-columns:12px 1fr 26px;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.rev{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2)}
.rev-h{display:flex;align-items:center;gap:8px}
.rev-h .nm{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rev-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.pill{padding:0 10px;border-radius:999px;font-size:.74rem;border:1px solid var(--line);color:var(--muted);flex:none}
.pill.v{color:var(--ok);border-color:currentColor}
.rev p{white-space:pre-wrap;word-break:break-word}
.mm-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.mm-card .info{flex:1;min-width:0}
.mm-card .info b{display:block}

/* ---------- Banner (pending ratings) ---------- */
.banner{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:25}
.banner:empty{display:none}
.bar-note{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#2a2312;border-bottom:1px solid var(--gold-deep);font-size:.9rem}

/* ---------- Chat ---------- */
.wrap.chat-page{padding:0;max-width:720px;height:calc(100dvh - var(--top) - env(safe-area-inset-top,0px))}
.chatbox{display:flex;flex-direction:column;height:100%}
.chat-head{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);display:grid;gap:6px}
.chat-head .t{display:flex;align-items:center;gap:10px}
.chat-head h1{font-size:1rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parties{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);align-items:center}
.parties b{color:var(--text);font-weight:600}
.statebar{padding:9px 12px;font-size:.88rem;border-bottom:1px solid var(--line);background:var(--surface-2)}
.statebar:empty{display:none}
.statebar.ok{color:var(--ok)}
.chat-actions{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.chat-actions:empty{display:none}
.chat-actions .btn{flex:none}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:84%;padding:8px 12px;border-radius:14px;background:var(--surface-2);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.bubble.me{align-self:flex-end;background:#2b2618;border:1px solid var(--gold-deep)}
.bubble.priv{border:1px dashed var(--gold);background:#1c1910}
.bubble .who{font-size:.78rem;margin-bottom:2px;font-weight:700}
.bubble time{display:block;font-size:.7rem;color:var(--muted);margin-top:3px}
.priv-tag{display:flex;align-items:center;gap:5px;color:var(--gold);font-size:.75rem;font-weight:700;margin-bottom:3px}
.priv-tag .ic{width:13px;height:13px}
.composer{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:grid;gap:8px}
.composer.private{border-top:2px solid var(--gold)}
.composer .row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:130px;resize:none;flex:1}
.composer .btn{min-width:50px;padding:0 14px}
.lockrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lock-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font-weight:700;font-size:.88rem}
.lock-btn .ic{width:16px;height:16px}
.lock-btn[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:rgba(214,178,106,.12)}
.lockrow select{width:auto;min-height:36px;padding:0 10px;font-size:.88rem}
.priv-note{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:var(--gold)}
.priv-note .ic{width:16px;height:16px;margin-top:3px}
.flip{transform:scaleX(-1)}
.small{font-size:.82rem}
.st-open{color:var(--blue)} .st-completed{color:var(--ok)} .st-cancelled{color:var(--danger)}
a.mine{color:inherit;text-decoration:none}
a.mine:hover{border-color:var(--gold-deep)}
.mine .last{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.mine .av{width:48px;height:48px;border-radius:50%}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.cat-row span{flex:1}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline-form input[type=text],.inline-form input[type=email]{flex:1;min-width:180px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:90vw;padding:12px 18px;border-radius:12px;background:#26262e;border:1px solid var(--gold-deep);text-align:center;transition:all .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--danger)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

async function compress(file, max = 1280, q = 0.82) {
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", q));
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });
async function uploadImg(file) {
  const blob = await compress(file).catch(() => file);
  const url = `https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`;
  const parse = async r => {
    let j; try { j = await r.json(); } catch { throw new Error(`رد غير صالح من ImgBB (${r.status})`); }
    if (!j.success) throw new Error(`ImgBB: ${j.error?.message || r.status}`);
    return j.data.display_url || j.data.url;
  };
  try {                                                   // attempt 1: multipart file
    const fd = new FormData(); fd.append("image", blob, "img.jpg");
    return await parse(await fetch(url, { method: "POST", body: fd }));
  } catch (e1) {
    console.warn("ImgBB multipart failed:", e1);
    try {                                                 // attempt 2: base64 form body
      const b64 = await blobToB64(blob);
      return await parse(await fetch(url, { method: "POST", body: new URLSearchParams({ image: b64 }) }));
    } catch (e2) {
      console.error("ImgBB base64 failed:", e2);
      throw new Error(e2 instanceof TypeError
        ? "تعذر الاتصال بخدمة رفع الصور (ImgBB). عطّل مانع الإعلانات/الإضافات في المتصفح وجرّب شبكة أخرى."
        : e2.message);
    }
  }
}

  const m = new Map();
  for (const r of state.reviews) {
    if (!(r.rating >= 1 && r.rating <= 5)) continue;
    const s = m.get(r.targetId) || { all: { sum: 0, count: 0 }, trade: { sum: 0, count: 0 }, middleman: { sum: 0, count: 0 }, dist: [0, 0, 0, 0, 0] };
    for (const k of ["all", r.kind]) if (s[k]) { s[k].sum += r.rating; s[k].count++; }
    s.dist[r.rating - 1]++;
    m.set(r.targetId, s);
  }
  state.stats = m;
  state.reviewIds = new Set([...state.reviews.map(r => r.id), ...state.myReviewIds]);
}
function statOf(uid, kind = "all") {
  const s = state.stats.get(uid)?.[kind];
  return s && s.count ? { avg: s.sum / s.count, count: s.count } : { avg: 0, count: 0 };
}
function starsHTML(avg, size = 16) {
  const w = Math.max(0, Math.min(100, avg / 5 * 100));
  return `<span class="stars" style="--s:${size}px" role="img" aria-label="${avg.toFixed(1)} من 5"><span class="row base">${STAR.repeat(5)}</span><span class="fill" style="width:${w}%"><span class="row">${STAR.repeat(5)}</span></span></span>`;
}
function rateChip(uid, kind = "all", showNone = false) {
  const { avg, count } = statOf(uid, kind);
  if (!count) return showNone ? `<button class="rate-chip none" data-act="reviews" data-uid="${uid}">لا تقييمات بعد</button>` : "";
  return `<button class="rate-chip" data-act="reviews" data-uid="${uid}" aria-label="${avg.toFixed(1)} من 5، ${count} تقييم">${STAR}${avg.toFixed(1)}<small>(${count})</small></button>`;
}
function summaryHTML(uid, withDist = false) {
  const all = statOf(uid), mm = statOf(uid, "middleman"), tr = statOf(uid, "trade");
  if (!all.count) return `<p class="muted">لا توجد تقييمات بعد.</p>`;
  const dist = state.stats.get(uid).dist;
  const line = (label, s, unit) => s.count ? `<div class="muted" style="font-size:.88rem">${label}: <b style="color:var(--text)">${s.avg.toFixed(1)}</b> · ${s.count} ${unit}</div>` : "";
  return `<div class="summary">

    <div>
      ${withDist ? `<div class="dist">${[5, 4, 3, 2, 1].map(n => `<div><span>${n}</span><span class="bar"><i style="width:${dist[n - 1] / all.count * 100}%"></i></span><span>${dist[n - 1]}</span></div>`).join("")}</div>` : ""}
      ${line("كوسيط", mm, "صفقة موثّقة")}${line("كبائع/مشتري", tr, "صفقة مباشرة")}

/* Smart rating rules: which reviews does the current user still owe? */
function pendingRatings() {
  const u = state.user;
  if (!u || !state.myReviewsReady) return [];
  const out = [];
  for (const c of state.chats.values()) {
    if (c.status !== "completed" || !c.participants?.includes(u.uid)) continue;
    if (c.middlemanId) {                                    // (a) middleman present → rate the middleman
      if (!state.reviewIds.has(`middleman_${c.id}_${u.uid}`))
        out.push({ kind: "middleman", targetId: c.middlemanId, targetName: c.middlemanName, refId: c.id, refTitle: c.offerTitle });
    } else {                                                // (b) direct trade → rate each other
      const other = c.participants.find(p => p !== u.uid);
      if (!state.reviewIds.has(`trade_${c.id}_${u.uid}`))
        out.push({ kind: "trade", targetId: other, targetName: other === c.ownerId ? c.ownerName : c.starterName, refId: c.id, refTitle: c.offerTitle });
    }
  }
  return out;
}
function blockIfPending() {
  const p = pendingRatings();
  if (!p.length) return false;
  toast("قيّم صفقاتك المكتملة أولاً قبل بدء صفقة جديدة", true);
  openRate(p[0]);

}

}

  const base = { uid: u.uid, name: u.displayName || "مستخدم", photo: u.photoURL || "", since: Date.now() };
  if (state.isAdmin) {

/* =====================================================================
   6) Real-time chat listeners
   Three live queries feed one merged map:
     A) chats I take part in            (participants array-contains uid)
     B) chats where I am the middleman  (middlemanId == uid)
     C) [middlemen only] open requests  (mmRequested == true && middlemanId == null)
   ===================================================================== */
function startChatListeners() {
  const u = state.user; if (!u) return;
  const col = collection(db, "chats");
  const qs = [query(col, where("participants", "array-contains", u.uid)), query(col, where("middlemanId", "==", u.uid))];
  if (isMM()) qs.push(query(col, where("mmRequested", "==", true), where("middlemanId", "==", null)));
  state.chatSets = qs.map(() => new Map());
  const ready = new Set();
  const mark = i => { ready.add(i); if (ready.size === qs.length) state.chatsReady = true; };
  state.chatUnsubs = qs.map((q, i) => onSnapshot(q, snap => {
    state.chatSets[i] = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    mark(i); mergeChats();
  }, err => {
    console.warn("chats listener", err); mark(i); mergeChats();
    if (err.code === "permission-denied" && !state.rulesWarned) { state.rulesWarned = true; toast("تعذر قراءة المحادثات: انشر ملف firestore.rules الجديد في Firebase Console ثم Rules ثم Publish.", true); }
  }));
}
function stopChatListeners() { state.chatUnsubs.forEach(f => f()); state.chatUnsubs = []; state.chatSets = []; }
function mergeChats() {
  const m = new Map();
  state.chatSets.forEach(s => s.forEach((v, k) => m.set(k, v)));
  state.chats = m;
  onChatsChanged();
}

async function submitOffer(e) {
  e.preventDefault();
  if (blockIfPending()) return;
  const d = Object.fromEntries(new FormData(e.target));
  const clean = k => (d[k] || "").trim();
  if (clean("title").length < 3) return toast("اكتب عنواناً واضحاً للعرض", true);
  if (clean("desc").length < 10) return toast("الوصف قصير جداً", true);
  if (d.otype === "trade" ? !clean("trade") : !clean("price")) return toast(d.otype === "trade" ? "اكتب ما تريده مقابل عرضك" : "حدد السعر أو الميزانية", true);
  if (!postFiles.length) return toast("أضف صورة واحدة على الأقل", true);
  const btn = $("#postBtn"); btn.disabled = true; btn.textContent = "جارٍ رفع الصور…";
  let stage = "upload";
  try {
    const images = [];
    for (const f of postFiles) images.push(await uploadImg(f));   // one by one → clearer errors
    stage = "save";
    btn.textContent = "جارٍ النشر…";
    const u = state.user;
    await addDoc(collection(db, "offers"), {
      uid: u.uid, name: u.displayName || "مستخدم", photo: u.photoURL || "",
      type: d.otype, game: d.game, category: d.category,
      title: clean("title"), desc: clean("desc"),
      price: d.otype === "trade" ? "" : clean("price"), trade: d.otype === "trade" ? clean("trade") : "",
      images, status: "active", createdAt: Date.now()
    });
    await loadOffers(); postFiles = [];
    toast("تم نشر عرضك بنجاح"); location.hash = "#/";
  } catch (err) {
    console.error(err);
    toast(stage === "upload" ? "فشل رفع الصورة: " + err.message
      : err.code === "permission-denied" ? "رفضت قواعد Firestore نشر العرض — انشر firestore.rules الجديد من Firebase Console."
      : "فشل حفظ العرض (" + (err.code || err.message) + ")", true);
    btn.disabled = false; btn.textContent = "نشر العرض";
  }
}

/* =====================================================================
   9) Chat: list, room, messages, middleman actions
   chats/{offerId}_{starterId}            – the deal room
   chats/{id}/messages/{mid}              – type "public" (everyone in the room)
                                            or "private" (audience = [sender, recipient])
   ===================================================================== */
const partyRoles = c => c.offerType === "sell" ? { owner: "البائع", starter: "المشتري" }
  : c.offerType === "buy" ? { owner: "المشتري", starter: "البائع" } : { owner: "صاحب العرض", starter: "الطرف الآخر" };
const partyName = (c, id) => id === c.ownerId ? c.ownerName : id === c.starterId ? c.starterName : id === c.middlemanId ? c.middlemanName : "مستخدم";
function chatRole(c) {
  const u = state.user.uid;
  if (c.participants?.includes(u)) return "participant";
  if (c.middlemanId === u) return "middleman";
  if (isMM() && c.mmRequested && !c.middlemanId) return "candidate";
  return "none";
}

async function startChat(offerId) {
  if (!state.user) { toast("سجّل الدخول للمراسلة", true); login(); return; }
  const o = state.offers.find(x => x.id === offerId); if (!o) return;
  if (o.uid === state.user.uid) return toast("هذا عرضك أنت", true);
  if (o.status === "sold") return toast("تم بيع هذا العرض", true);
  if (blockIfPending()) return;
  const u = state.user, id = `${o.id}_${u.uid}`;
  try {
    if (!state.chats.has(id)) {
      await setDoc(doc(db, "chats", id), {
        offerId: o.id, offerTitle: (o.title || "").slice(0, 100), offerType: o.type, offerImage: safeUrl(o.images?.[0]),
        ownerId: o.uid, ownerName: o.name || "مستخدم", ownerPhoto: o.photo || "",
        starterId: u.uid, starterName: u.displayName || "مستخدم", starterPhoto: u.photoURL || "",
        participants: [o.uid, u.uid], middlemanId: null, middlemanName: "", mmRequested: false,
        status: "open", confirmedBy: [], lastMessage: "", createdAt: Date.now(), updatedAt: Date.now()
      });
    }
    closeModal(); location.hash = "#/chat/" + id;
  } catch (e) {
    console.error("startChat", e);
    if (e.code === "permission-denied" && state.chats.has(id)) { closeModal(); location.hash = "#/chat/" + id; return; }
    toast(e.code === "permission-denied"
      ? "رفضت قواعد Firestore إنشاء المحادثة — انشر firestore.rules الجديد من Firebase Console ثم Rules ثم Publish."
      : "تعذر فتح المحادثة (" + (e.code || e.message) + ")", true);
  }
}

function viewChat(tk, id) {
  if (!state.user) { app$.innerHTML = gate("سجّل الدخول لفتح المحادثة."); return; }
  state.chatId = id; state.composePrivate = false; state.privateTo = ""; state.composerSig = ""; state.stick = true;
  app$.className = "wrap chat-page";
  app$.innerHTML = `<div class="chatbox">

    <div class="statebar" id="cstate"></div>

    <div class="composer" id="composer"></div>
  </div>`;

function refreshChat() {
  if (curRoute() !== "chat" || !$("#chead")) return;
  const c = state.chats.get(state.chatId);
  if (!c) {
    $("#chead").innerHTML = `<div class="t"><a class="icon-btn" href="#/chats" aria-label="رجوع">${ic("back")}</a><h1>المحادثة</h1></div>`;
    $("#cstate").innerHTML = ""; $("#cacts").innerHTML = ""; $("#composer").innerHTML = "";
    $("#msgs").innerHTML = state.chatsReady ? `<div class="empty" style="margin:auto">لم نجد هذه المحادثة أو لا تملك صلاحية الوصول إليها.<br><span class="small">إن كانت هذه أول تجربة للمحادثات فتأكد من نشر قواعد Firestore الجديدة.</span></div>` : loadingHTML;
    return;
  }
  const role = chatRole(c), me = state.user.uid, pr = partyRoles(c);
  const confirmed = (c.confirmedBy || []).length;

  $("#chead").innerHTML = `
    <div class="t"><a class="icon-btn" href="#/chats" aria-label="رجوع">${ic("back")}</a><h1>${esc(c.offerTitle)}</h1><span class="st st-${c.status}">${CST[c.status]}</span></div>
    <div class="parties">
      <span>${pr.owner}: <b>${nameHTML(c.ownerId, c.ownerName)}</b> ${rateChip(c.ownerId)}</span>
      <span>${pr.starter}: <b>${nameHTML(c.starterId, c.starterName)}</b> ${rateChip(c.starterId)}</span>
      ${c.middlemanId ? `<span>الوسيط: <b>${nameHTML(c.middlemanId, c.middlemanName, true)}</b> ${rateChip(c.middlemanId, "middleman")}</span>` : ""}
    </div>`;

  let st = "", ok = false;
  if (c.status === "completed") { ok = true; st = c.middlemanId ? "اكتملت الصفقة بإشراف الوسيط. يقيّم الطرفان الوسيط." : "اكتملت الصفقة مباشرة. يقيّم البائع والمشتري بعضهما."; }
  else if (c.status === "cancelled") st = "أُلغيت هذه الصفقة.";
  else if (c.middlemanId) st = role === "middleman"
    ? "أنت وسيط هذه الصفقة. اطلب من كل طرف تسليم ما عليه، ثم اضغط «إنهاء الصفقة»."
    : `الوسيط ${esc(c.middlemanName)} داخل المحادثة. أرسل بيانات الحساب بـ«رسالة سرية» فقط؛ لن يراها الطرف الآخر.`;
  else if (c.mmRequested) st = role === "candidate" ? "هذه الصفقة تطلب وسيطاً. انضم لتبدأ الإشراف عليها." : "تم إرسال طلب الوسيط — بانتظار انضمام أحد الوسطاء المعتمدين…";
  else st = `صفقة مباشرة: بعد التسليم يؤكد الطرفان الإتمام (${confirmed}/2) ثم يقيّم كل طرف الآخر. يمكنك طلب وسيط في أي وقت.`;
  const sb = $("#cstate"); sb.className = "statebar" + (ok ? " ok" : ""); sb.innerHTML = st;

  const A = [];
  if (role === "candidate") A.push(`<button class="btn btn-gold btn-sm" data-act="join-chat">${ic("shield")}انضم كوسيط</button>`);
  if (role === "participant" && c.status === "open") {
    if (!c.middlemanId) {
      A.push(!c.mmRequested
        ? `<button class="btn btn-gold btn-sm" data-act="req-mm">${ic("shield")}اطلب وسيطاً</button>`
        : `<a class="btn btn-line btn-sm" href="${DISCORD_URL}" target="_blank" rel="noopener">نبّه الوسطاء على ديسكورد</a>`);
      A.push((c.confirmedBy || []).includes(me)
        ? `<span class="muted small" style="align-self:center;flex:none">أكّدت الإتمام — بانتظار الطرف الآخر</span>`
        : `<button class="btn btn-ghost btn-sm" data-act="confirm-direct">${ic("check")}تأكيد إتمام الصفقة</button>`);
    }
    A.push(`<button class="btn btn-danger btn-sm" data-act="cancel-chat">إلغاء الصفقة</button>`);
  }
  if (role === "middleman" && c.status === "open")
    A.push(`<button class="btn btn-gold btn-sm" data-act="complete-chat">${ic("check")}إنهاء الصفقة</button><button class="btn btn-danger btn-sm" data-act="cancel-chat">إلغاء الصفقة</button>`);
  if (c.status === "completed" && role === "participant") {
    const p = pendingRatings().find(x => x.refId === c.id);
    A.push(p ? `<button class="btn btn-gold btn-sm" data-act="rate-chat">${ic("star")}قيّم الآن (إلزامي)</button>` : `<span class="muted small" style="align-self:center">✓ تم تقييمك لهذه الصفقة</span>`);
    if (p && !state.prompted.has(c.id) && !$("#rmodal").classList.contains("open")) { state.prompted.add(c.id); openRate(p); }
  }
  $("#cacts").innerHTML = A.join("");

  renderComposer();
  if (role === "participant" || role === "middleman") ensureMsgListeners(c.id);
  else { stopMsgListeners(); $("#msgs").innerHTML = `<div class="empty" style="margin:auto">${role === "candidate" ? "انضم إلى المحادثة كوسيط لتظهر لك الرسائل." : "لا تملك صلاحية عرض هذه المحادثة."}</div>`; }
}

/* live messages: public stream + my private stream (rules make private ones invisible to the other trader) */
function ensureMsgListeners(cid) {
  if (state.msgUnsubs.length && state.msgCid === cid) return;
  stopMsgListeners(); state.msgCid = cid;
  const col = collection(db, "chats", cid, "messages"), uid = state.user.uid;
  const conv = snap => snap.docs.map(d => {
    const x = d.data({ serverTimestamps: "estimate" });
    return { id: d.id, ...x, t: x.createdAt?.toMillis ? x.createdAt.toMillis() : Date.now() };
  });
  state.msgUnsubs = [
    onSnapshot(query(col, where("type", "==", "public")), s => { state.msgSets.pub = conv(s); renderMsgs(); }, e => console.warn("public msgs", e)),
    onSnapshot(query(col, where("audience", "array-contains", uid)), s => { state.msgSets.priv = conv(s); renderMsgs(); }, e => console.warn("private msgs", e)),
  ];
}
function stopMsgListeners() { state.msgUnsubs.forEach(f => f()); state.msgUnsubs = []; state.msgCid = null; state.msgSets = { pub: [], priv: [] }; }

function bubble(m, c, u) {
  const me = m.senderId === u, priv = m.type === "private", isMMuser = u === c.middlemanId;
  let tag = "";
  if (priv) {
    const rec = m.audience.find(a => a !== m.senderId);
    tag = me ? (isMMuser ? `رسالة سرية إلى ${esc(partyName(c, rec))}` : "رسالة سرية إلى الوسيط — لا يراها الطرف الآخر")
             : (isMMuser ? `رسالة سرية من ${esc(m.senderName)}` : "رسالة سرية من الوسيط إليك");
  }
  const time = new Date(m.t).toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" });
  return `<div class="bubble ${me ? "me" : ""} ${priv ? "priv" : ""}">
    ${priv ? `<div class="priv-tag">${ic("lock")}${tag}</div>` : ""}
    ${!me ? `<div class="who">${nameHTML(m.senderId, m.senderName)}</div>` : ""}
    ${esc(m.text)}<time>${time}</time></div>`;
}
function renderMsgs() {
  const box = $("#msgs"); if (!box || curRoute() !== "chat") return;
  const c = state.chats.get(state.chatId); if (!c) return;
  const u = state.user.uid;
  const all = [...state.msgSets.pub, ...state.msgSets.priv].sort((a, b) => a.t - b.t);
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.innerHTML = all.length ? all.map(m => bubble(m, c, u)).join("")
    : `<div class="empty" style="margin:auto">ابدأ المحادثة، واتفقا على تفاصيل الصفقة هنا.</div>`;
  if (near || state.stick) { box.scrollTop = box.scrollHeight; state.stick = false; }
}

function renderComposer(force = false) {
  const box = $("#composer"); if (!box) return;
  const c = state.chats.get(state.chatId); if (!c) return;
  const role = chatRole(c), mmHere = !!c.middlemanId, isMMr = role === "middleman";
  if (isMMr && !state.privateTo) state.privateTo = c.participants[0];
  const sig = [c.status, c.middlemanId || "", role, state.composePrivate, state.privateTo].join("|");
  if (!force && sig === state.composerSig) return;
  state.composerSig = sig;
  const old = $("#msgText")?.value || "";
  const priv = state.composePrivate && mmHere;
  box.className = "composer" + (priv ? " private" : "");
  if (role === "none" || role === "candidate") { box.innerHTML = ""; return; }
  if (c.status !== "open") { box.innerHTML = `<div class="muted" style="text-align:center;padding:6px">المحادثة مغلقة.</div>`; return; }
  box.innerHTML = `
    ${mmHere ? `<div class="lockrow">
        <button type="button" class="lock-btn" data-act="toggle-priv" aria-pressed="${priv}">${ic("lock")}رسالة سرية</button>
        ${isMMr && priv ? `<select id="privTo" aria-label="المستلم">${c.participants.map(p => `<option value="${p}" ${p === state.privateTo ? "selected" : ""}>${esc(partyName(c, p))}</option>`).join("")}</select>` : ""}
      </div>`
      : `<div class="muted small">الرسائل السرية للوسيط تتوفر بعد انضمام وسيط. لا تكتب بيانات الحساب في الرسائل العلنية.</div>`}
    ${priv ? `<div class="priv-note">${ic("lock")}<span>${isMMr ? `تصل إلى ${esc(partyName(c, state.privateTo))} فقط.` : `يراها أنت والوسيط ${esc(c.middlemanName)} فقط. الطرف الآخر لا يستطيع رؤيتها.`}</span></div>` : ""}
    <div class="row"><textarea id="msgText" rows="1" maxlength="2000" placeholder="${priv ? "اكتب رسالتك السرية…" : "اكتب رسالة…"}"></textarea>
      <button class="btn btn-gold" data-act="send" aria-label="إرسال">${ic("send", "flip")}</button></div>`;
  if (old) $("#msgText").value = old;
}

async function sendMessage() {
  const c = state.chats.get(state.chatId); if (!c) return;
  const inp = $("#msgText"); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  if (c.status !== "open") return toast("المحادثة مغلقة", true);
  const u = state.user, role = chatRole(c);
  let type = "public", audience = [];
  if (state.composePrivate) {
    if (!c.middlemanId) return toast("الرسائل السرية تتوفر بعد انضمام وسيط", true);
    type = "private";
    audience = role === "middleman" ? [u.uid, state.privateTo || c.participants[0]] : [u.uid, c.middlemanId];
  }
  const btn = $("[data-act=send]"); btn.disabled = true;
  try {
    await addDoc(collection(db, "chats", c.id, "messages"), {
      senderId: u.uid, senderName: u.displayName || "مستخدم", type, audience,
      text: text.slice(0, 2000), createdAt: serverTimestamp()
    });
    inp.value = ""; state.stick = true;
    if (type === "public") updateDoc(doc(db, "chats", c.id), { lastMessage: text.slice(0, 80), updatedAt: Date.now() }).catch(() => {});
  } catch (e) { dbError(e); }
  finally { btn.disabled = false; inp.focus(); }
}
async function chatUpdate(data, okMsg) {
  try { await updateDoc(doc(db, "chats", state.chatId), { ...data, updatedAt: Date.now() }); if (okMsg) toast(okMsg); }
  catch (e) { dbError(e); }
}
async function confirmDirect() {
  const cid = state.chatId, uid = state.user.uid;
  try {
    await runTransaction(db, async tx => {
      const ref = doc(db, "chats", cid), s = await tx.get(ref), c = s.data();
      const cb = [...new Set([...(c.confirmedBy || []), uid])];
      const upd = { confirmedBy: cb, updatedAt: Date.now() };
      if (cb.length === 2) { upd.status = "completed"; upd.completedAt = Date.now(); }
      tx.update(ref, upd);
    });
    toast("تم تسجيل تأكيدك");
  } catch (e) { dbError(e); }
}

/* =====================================================================
   12) Events (delegation)
   ===================================================================== */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const { act, id, v, uid } = el.dataset;
  const offer = () => state.offers.find(o => o.id === id) || state.myOffers.find(o => o.id === id);
  switch (act) {
    case "menu": openDrawer(); break;
    case "menu-close": closeDrawer(); break;
    case "login": closeDrawer(); login(); break;
    case "logout": closeDrawer(); logout(); break;
    case "open": openOffer(id); break;
    case "close-modal": closeModal(); break;
    case "close-rmodal": closeRModal(); break;
    case "fgame": state.filter.game = v; $$("[data-act=fgame]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); renderFeed(); break;
    case "ftype": state.filter.type = v; $$("[data-act=ftype]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); renderFeed(); break;
    case "rm-thumb": postFiles.splice(+el.dataset.i, 1); drawThumbs(); break;

    /* offers */
    case "toggle-sold": {
      const o = offer(); if (!o) break;
      try { const s = o.status === "sold" ? "active" : "sold"; await updateDoc(doc(db, "offers", id), { status: s }); o.status = s; toast(s === "sold" ? "تم تعليم العرض كمباع" : "أُعيد نشر العرض"); await loadOffers(); render(); }
      catch (err) { dbError(err); }
      break;
    }
    case "del-offer":
      if (!confirm("حذف هذا العرض نهائياً؟")) break;
      try { await deleteDoc(doc(db, "offers", id)); state.offers = state.offers.filter(o => o.id !== id); toast("تم حذف العرض"); render(); }
      catch (err) { dbError(err); }
      break;

    /* chat */
    case "start-chat": startChat(id); break;
    case "send": sendMessage(); break;
    case "toggle-priv": state.composePrivate = !state.composePrivate; renderComposer(true); $("#msgText")?.focus(); break;
    case "req-mm": chatUpdate({ mmRequested: true }, "تم إرسال طلب الوسيط. سينضم أحد الوسطاء المعتمدين قريباً."); break;
    case "join-chat": chatUpdate({ middlemanId: state.user.uid, middlemanName: state.user.displayName || "وسيط" }, "انضممت إلى المحادثة كوسيط"); break;
    case "complete-chat": if (confirm("هل سُلّم كل طرف حقه وتمت الصفقة؟ سيُطلب من الطرفين تقييمك.")) chatUpdate({ status: "completed", completedAt: Date.now() }, "تم إنهاء الصفقة"); break;
    case "cancel-chat": if (confirm("إلغاء هذه الصفقة؟ لا يمكن التراجع.")) chatUpdate({ status: "cancelled" }, "تم إلغاء الصفقة"); break;
    case "confirm-direct": if (confirm("أؤكد أن الصفقة تمت وتم تسليم كل شيء؟")) confirmDirect(); break;

    /* ratings */
    case "reviews": openReviews(uid); break;
    case "pick-star": pickStar(+v); break;
    case "submit-review": submitReview(); break;
    case "rate-pending": { const p = pendingRatings()[0]; if (p) openRate(p); break; }
    case "rate-chat": { const p = pendingRatings().find(x => x.refId === state.chatId); if (p) openRate(p); break; }
    case "copy":
      try { await navigator.clipboard.writeText(v); toast("تم النسخ"); } catch { toast("انسخ النص يدوياً", true); }
      break;
    case "del-review":
      if (!confirm("حذف هذا التقييم؟")) break;
      try {
        await deleteDoc(doc(db, "reviews", id));
        state.reviews = state.reviews.filter(r => r.id !== id); state.myReviewIds.delete(id); buildStats();
        toast("تم حذف التقييم"); openReviews(uid); afterReview();
      } catch (err) { dbError(err); }
      break;

    /* admin */
    case "cat-del": {
      const c = state.categories.find(x => x.id === id); if (!c) break;
      if (!confirm(`حذف القسم «${c.name}»؟ لن تُحذف العروض الموجودة فيه.`)) break;
      try { await deleteDoc(doc(db, "categories", id)); state.categories = state.categories.filter(x => x.id !== id); if (state.filter.game === c.name) state.filter.game = "all"; toast("تم حذف القسم"); drawAdmin(); }
      catch (err) { dbError(err); }
      break;
    }
    case "cat-seed":
      try {
        for (const name of DEFAULT_CATS) { const rec = { name, createdAt: Date.now() }; const ref = await addDoc(collection(db, "categories"), rec); state.categories.push({ id: ref.id, ...rec }); }
        toast("تم حفظ الأقسام الافتراضية"); drawAdmin();
      } catch (err) { dbError(err); }
      break;
    case "mm-save":
      try { const color = safeColor($("#col-" + uid).value); await updateDoc(doc(db, "middlemen", uid), { color }); state.middlemen.get(uid).color = color; toast("تم حفظ اللون"); drawAdmin(); }
      catch (err) { dbError(err); }
      break;
    case "mm-remove":
      if (!confirm("إزالة صلاحية الوسيط عن هذا المستخدم؟")) break;
      try { await deleteDoc(doc(db, "middlemen", uid)); state.middlemen.delete(uid); toast("أُزيلت الصلاحية"); drawAdmin(); }
      catch (err) { dbError(err); }
      break;
    case "inv-del":
      try { await deleteDoc(doc(db, "mmInvites", id)); state.invites = state.invites.filter(i => i.id !== id); toast("أُلغيت الدعوة"); drawAdmin(); }
      catch (err) { dbError(err); }
      break;
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "cat-add") addCategory();
  if (f.dataset.form === "mm-promote") promoteByEmail();
});
document.addEventListener("change", e => { if (e.target.id === "privTo") { state.privateTo = e.target.value; renderComposer(true); } });
document.addEventListener("input", e => { if (e.target.id === "rcomment") $("#rcount").textContent = e.target.value.length + "/300"; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#rmodal").classList.contains("open")) closeRModal(); else { closeDrawer(); closeModal(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card[data-act=open]")) { e.preventDefault(); openOffer(e.target.dataset.id); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "msgText") { e.preventDefault(); sendMessage(); }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("#rmodal").addEventListener("click", e => { if (e.target.id === "rmodal") closeRModal(); });

/* First paint (before auth resolves) */
renderChrome();

</script>
</body>
</html>
